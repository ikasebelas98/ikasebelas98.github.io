<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik | Ruang Bisnis & Komersial - IKA SMAN 11 Bandung Angkatan 98</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Inter, Montserrat, & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Stylesheet Utama Website -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/counter.css">

    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
        }

        .text-gold-custom {
            color: #eab308;
        }

        /* 1 Kotak = 1 Alumni | Outline emas hanya saat hover */
        .rubik-box-card {
            background: rgba(30, 41, 59, 0.72);
            border: 1.5px solid rgba(148, 163, 184, 0.18);
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .rubik-box-card:hover {
            transform: translateY(-4px);
            border-color: #eab308;
            box-shadow: 0 0 0 1px rgba(234, 179, 8, 0.45), 0 14px 28px -8px rgba(0, 0, 0, 0.65);
        }

        .rubik-arrow-btn {
            background: rgba(15, 23, 42, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.16);
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .rubik-arrow-btn:hover {
            background: rgba(234, 179, 8, 0.95);
            border-color: #fbbf24;
            color: #0f172a;
            transform: scale(1.06);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between">

    <!-- ==========================================
         NAVBAR CONTAINER
    ========================================== -->
    <div id="mainNavbarContainer"></div>

    <!-- Mega Menu -->
    <div class="mega-menu">
        <div class="mega-menu-container">
            <img id="mega-icon" src="assets/images/tumb 01 tentang kita.webp" class="mega-icon" alt="Tentang Kita">
            <div class="mega-content">
                <h2 id="mega-title" class="mega-title">Satu Perjalanan untuk Maju Bersama</h2>
                <ul id="mega-links" class="mega-links"></ul>
            </div>
        </div>
    </div>

    <!-- ==========================================
         KONTEN UTAMA DIREKTORI RUBIK
    ========================================== -->
    <main class="container mx-auto px-4 py-8 flex-grow">

        <!-- Header Judul Halaman -->
        <div class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight font-heading mb-2">
                RUBIK <span class="text-gold-custom">| RUANG BISNIS & KOMERSIAL</span>
            </h1>
            <p class="text-slate-400 text-sm max-w-2xl mx-auto">
                Etalase produk, jasa, keahlian, dan portofolio karya alumni SMAN 11 Bandung Angkatan '98.
            </p>
        </div>

        <!-- Pencarian & Filter Kategori Usaha -->
        <div class="max-w-4xl mx-auto mb-8 flex flex-col sm:flex-row gap-3">
            <div class="relative flex-grow">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-500"></i>
                <input type="text" id="rubikSearchInput" placeholder="Cari nama usaha, produk, jasa, portofolio, atau nama alumni..."
                       class="w-full pl-11 pr-4 py-3 bg-slate-800/90 border border-slate-700 rounded-xl text-white text-sm placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
            </div>

            <select id="rubikCategoryFilter" class="bg-slate-800/90 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500 transition sm:w-64">
                <option value="">-- Semua Kategori Usaha --</option>
                <option value="Kuliner & F&B">Kuliner & F&B</option>
                <option value="Fashion, Konveksi & Kriya">Fashion, Konveksi & Kriya</option>
                <option value="Jasa Profesional & Konsultan">Jasa Profesional & Konsultan</option>
                <option value="Kreatif, Media & Digital">Kreatif, Media & Digital</option>
                <option value="Properti, Konstruksi & Interior">Properti, Konstruksi & Interior</option>
                <option value="Otomotif & Bengkel">Otomotif & Bengkel</option>
                <option value="Kesehatan, Kecantikan & Kebugaran">Kesehatan, Kecantikan & Kebugaran</option>
                <option value="Pendidikan, Pelatihan & Kursus">Pendidikan, Pelatihan & Kursus</option>
                <option value="Agribisnis, Pertanian & Peternakan">Agribisnis, Pertanian & Peternakan</option>
                <option value="Perdagangan Umum & Retail">Perdagangan Umum & Retail</option>
                <option value="Lainnya">Lainnya</option>
            </select>
        </div>

        <!-- Grid Kotak Produk / Portofolio (1 Kotak = 1 Alumni) -->
        <div id="rubikGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
            <div class="col-span-full text-center py-12 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-amber-500"></i>
                <p>Memuat etalase bisnis & portofolio alumni...</p>
            </div>
        </div>

    </main>

    <!-- ==========================================
         FOOTER VISITOR COUNTER
    ========================================== -->
    <div class="counter-wrapper">
        <div class="visitor-counter">
            <div class="counter-time-group">
                <span id="liveDayDate" class="counter-date">MEMUAT TANGGAL...</span>
                <span class="counter-divider">|</span>
                <span id="liveClock" class="counter-clock">00:00:00 WIB</span>
            </div>
            <span class="counter-divider-vertical"></span>
            <div class="counter-stats-group">
                <span class="counter-label">visitor:</span>
                <span id="visitorCount" class="counter-number">000000</span>
            </div>
        </div>
    </div>

    <!-- ==========================================
         FIREBASE & RUBIK DIRECTORY ENGINE
    ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBSuusyB8UmVN721It89xqgfxZf8swB6gk",
            authDomain: "ikasebelas98-96595.firebaseapp.com",
            projectId: "ikasebelas98-96595",
            storageBucket: "ikasebelas98-96595.firebasestorage.app",
            messagingSenderId: "142033224407",
            appId: "1:142033224407:web:21a6cd2305c75c1deee692",
            measurementId: "G-W486XXJVBX"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseSignOut = signOut;
        window.firebaseAuth = auth;

        let allRubikEntries = [];
        const slideIndexMap = new Map();

        onAuthStateChanged(auth, async (user) => {
            const loginBtn = document.querySelector('#login') || document.querySelector('a[href*="javascript:void"]');
            const targetElement = loginBtn ? (loginBtn.tagName === 'A' ? loginBtn : (loginBtn.querySelector('a') || loginBtn)) : null;

            if (user) {
                try {
                    const userDoc = await getDoc(doc(db, "alumni", user.uid));
                    let namaLengkap = user.displayName || "ALUMNI SMAN 11";
                    let namaPanggilan = user.email ? user.email.split('@')[0].toUpperCase() : "ALUMNI";
                    let fotoProfile = "";
                    let userRole = "member";

                    if (userDoc.exists()) {
                        const d = userDoc.data();
                        namaLengkap = d.namaLengkap || namaLengkap;
                        namaPanggilan = (d.namaPanggilan || namaPanggilan).toUpperCase();
                        fotoProfile = d.foto || "";
                        userRole = d.role || "member";
                    }

                    if (targetElement) {
                        targetElement.innerHTML = `<span style="color: #eab308; font-weight: 700;">${namaPanggilan}</span>`;
                        targetElement.href = "javascript:void(0);";
                    }

                    if (typeof window.updateMegaMenuState === "function") {
                        window.updateMegaMenuState(user, {
                            namaLengkap,
                            namaPanggilan,
                            email: user.email || "",
                            foto: fotoProfile,
                            role: userRole
                        });
                    }
                    if (typeof window.loadMegaMenu === "function") {
                        window.loadMegaMenu("login");
                    }
                } catch (err) {
                    console.error("Gagal sinkronisasi navbar di Rubik:", err);
                }
            } else {
                if (targetElement) {
                    targetElement.innerHTML = "Sign In";
                    targetElement.href = "javascript:void(0);";
                }
                if (typeof window.updateMegaMenuState === "function") {
                    window.updateMegaMenuState(null);
                }
            }
        });

        function buildPhotosForEntry(data) {
            const photos = [];
            if (Array.isArray(data.rubikGaleri)) {
                data.rubikGaleri.slice(0, 6).forEach((item, idx) => {
                    if (item && item.image) {
                        photos.push({
                            image: item.image,
                            caption: item.caption || data.rubikNamaPerusahaan || data.namaUsaha || `Item ${idx + 1}`
                        });
                    }
                });
            }

            if (photos.length === 0 && data.rubikLogoUsaha) {
                photos.push({
                    image: data.rubikLogoUsaha,
                    caption: data.rubikNamaPerusahaan || data.namaUsaha || "Profil Usaha"
                });
            }

            if (photos.length === 0) {
                photos.push({
                    image: "assets/images/logoikagrey.png",
                    caption: data.rubikNamaPerusahaan || data.namaUsaha || "Ruang Bisnis Alumni"
                });
            }

            return photos;
        }

        function hasRubikContent(data) {
            const role = (data.role || "").toLowerCase();
            if (role === "admin" || role === "super_admin") return false;

            return Boolean(
                data.rubikAktif ||
                (data.rubikNamaPerusahaan && data.rubikNamaPerusahaan.trim()) ||
                (data.rubikNarasiUsaha && data.rubikNarasiUsaha.trim()) ||
                (Array.isArray(data.rubikGaleri) && data.rubikGaleri.length > 0) ||
                (data.statusPekerjaan === "wirausaha" && (data.namaUsaha || data.jenisUsaha)) ||
                (data.keahlian && data.keahlian.trim())
            );
        }

        async function loadRubikDirectory() {
            const gridEl = document.getElementById("rubikGrid");
            try {
                const snap = await getDocs(collection(db, "alumni"));
                const entries = [];

                snap.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (hasRubikContent(data)) {
                        const uid = data.uid || docSnap.id;
                        const photos = buildPhotosForEntry(data);
                        const namaPanggilan = (data.namaPanggilan || data.namaLengkap || "ALUMNI").toUpperCase();
                        const namaUsaha = (data.rubikNamaPerusahaan || data.namaUsaha || data.keahlian || namaPanggilan || "Usaha Alumni").trim();
                        const kategori = (data.rubikKategoriUsaha || data.jenisUsaha || (data.keahlian ? "Keahlian & Jasa" : "Lainnya")).trim();
                        const narasi = (data.rubikNarasiUsaha || data.keahlian || "").trim();

                        entries.push({
                            id: docSnap.id,
                            uid,
                            namaPanggilan,
                            namaLengkap: data.namaLengkap || "",
                            namaUsaha,
                            kategori,
                            narasi,
                            photos,
                            noUrut: data.noUrut || 999999
                        });
                    }
                });

                entries.sort((a, b) => a.noUrut - b.noUrut);
                allRubikEntries = entries;
                renderRubikGrid(allRubikEntries);
            } catch (err) {
                console.error("Gagal memuat direktori Rubik:", err);
                if (gridEl) {
                    gridEl.innerHTML = `<div class="col-span-full text-center py-8 text-red-400">Gagal memuat data direktori Rubik.</div>`;
                }
            }
        }

        function updateCardSlide(entryId, photos) {
            const idx = slideIndexMap.get(entryId) || 0;
            const current = photos[idx] || photos[0];
            const imgEl = document.getElementById(`rubikImg_${entryId}`);
            const capEl = document.getElementById(`rubikCap_${entryId}`);
            const counterEl = document.getElementById(`rubikSlidePos_${entryId}`);

            if (imgEl && current) {
                const isPlaceholderImg = current.image.includes("logoikagrey.png");
                imgEl.src = current.image;
                imgEl.alt = current.caption;
                imgEl.className = isPlaceholderImg
                    ? "w-full h-full object-contain p-8 opacity-60"
                    : "w-full h-full object-cover";
            }
            if (capEl && current) {
                capEl.textContent = current.caption;
            }
            if (counterEl) {
                counterEl.textContent = `${idx + 1}/${photos.length}`;
            }
        }

        function renderRubikGrid(list) {
            const gridEl = document.getElementById("rubikGrid");
            if (!gridEl) return;

            gridEl.innerHTML = "";

            if (list.length === 0) {
                gridEl.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">Belum ada usaha, jasa, keahlian, atau portofolio yang sesuai dengan pencarian/kategori.</div>`;
                return;
            }

            list.forEach((entry) => {
                if (!slideIndexMap.has(entry.id)) {
                    slideIndexMap.set(entry.id, 0);
                }

                const firstPhoto = entry.photos[0];
                const hasMultiple = entry.photos.length > 1;
                const isPlaceholderImg = firstPhoto.image.includes("logoikagrey.png");

                const rawCaption = (firstPhoto.caption || "").trim();
                const displayDesc =
                    rawCaption && rawCaption.toLowerCase() !== entry.namaUsaha.toLowerCase()
                        ? rawCaption
                        : (entry.narasi || entry.kategori);

                const card = document.createElement("div");
                card.className = "rubik-box-card rounded-2xl p-3 flex flex-col justify-between cursor-pointer";
                card.onclick = () => {
                    window.location.href = `rubik-profile.html?uid=${encodeURIComponent(entry.uid)}`;
                };

                const mediaWrapper = document.createElement("div");
                mediaWrapper.className = "relative w-full aspect-square rounded-xl overflow-hidden bg-slate-900 mb-3";

                const imgEl = document.createElement("img");
                imgEl.id = `rubikImg_${entry.id}`;
                imgEl.src = firstPhoto.image;
                imgEl.alt = firstPhoto.caption;
                imgEl.className = isPlaceholderImg
                    ? "w-full h-full object-contain p-8 opacity-60"
                    : "w-full h-full object-cover";

                mediaWrapper.appendChild(imgEl);

                if (hasMultiple) {
                    const prevBtn = document.createElement("button");
                    prevBtn.type = "button";
                    prevBtn.title = "Foto sebelumnya";
                    prevBtn.className = "rubik-arrow-btn absolute left-2 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full text-white text-xs flex items-center justify-center z-10";
                    prevBtn.innerHTML = `<i class="fa-solid fa-chevron-left"></i>`;
                    prevBtn.onclick = (ev) => {
                        ev.stopPropagation();
                        const currentIdx = slideIndexMap.get(entry.id) || 0;
                        const nextIdx = (currentIdx - 1 + entry.photos.length) % entry.photos.length;
                        slideIndexMap.set(entry.id, nextIdx);
                        updateCardSlide(entry.id, entry.photos);
                    };

                    const nextBtn = document.createElement("button");
                    nextBtn.type = "button";
                    nextBtn.title = "Foto berikutnya";
                    nextBtn.className = "rubik-arrow-btn absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full text-white text-xs flex items-center justify-center z-10";
                    nextBtn.innerHTML = `<i class="fa-solid fa-chevron-right"></i>`;
                    nextBtn.onclick = (ev) => {
                        ev.stopPropagation();
                        const currentIdx = slideIndexMap.get(entry.id) || 0;
                        const nextIdx = (currentIdx + 1) % entry.photos.length;
                        slideIndexMap.set(entry.id, nextIdx);
                        updateCardSlide(entry.id, entry.photos);
                    };

                    const badgePos = document.createElement("span");
                    badgePos.id = `rubikSlidePos_${entry.id}`;
                    badgePos.className = "absolute bottom-2 right-2 px-2 py-0.5 rounded-md bg-slate-950/80 text-[10px] font-semibold text-amber-400 z-10";
                    badgePos.textContent = `1/${entry.photos.length}`;

                    mediaWrapper.appendChild(prevBtn);
                    mediaWrapper.appendChild(nextBtn);
                    mediaWrapper.appendChild(badgePos);
                }

                const infoEl = document.createElement("div");
                infoEl.className = "space-y-1 text-left";
                infoEl.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-[10px] font-semibold uppercase tracking-wider text-amber-400 truncate">${entry.kategori}</span>
                        <span class="text-[10px] font-bold text-slate-400 shrink-0">${entry.namaPanggilan}</span>
                    </div>
                    <h3 class="font-bold text-white text-sm truncate">${entry.namaUsaha}</h3>
                    <p id="rubikCap_${entry.id}" class="text-xs text-slate-400 line-clamp-2 leading-snug min-h-[2rem]">${displayDesc}</p>
                `;

                card.appendChild(mediaWrapper);
                card.appendChild(infoEl);
                gridEl.appendChild(card);
            });
        }

        function applyRubikFilters() {
            const keyword = (document.getElementById("rubikSearchInput")?.value || "").trim().toLowerCase();
            const category = (document.getElementById("rubikCategoryFilter")?.value || "").trim();

            const filtered = allRubikEntries.filter((entry) => {
                const matchCat = category === "" || entry.kategori === category;
                const captionHaystack = entry.photos.map((p) => p.caption).join(" ").toLowerCase();
                const matchKw =
                    keyword === "" ||
                    entry.namaUsaha.toLowerCase().includes(keyword) ||
                    entry.namaPanggilan.toLowerCase().includes(keyword) ||
                    entry.namaLengkap.toLowerCase().includes(keyword) ||
                    entry.kategori.toLowerCase().includes(keyword) ||
                    entry.narasi.toLowerCase().includes(keyword) ||
                    captionHaystack.includes(keyword);

                return matchCat && matchKw;
            });

            renderRubikGrid(filtered);
        }

        document.addEventListener("DOMContentLoaded", () => {
            const searchInput = document.getElementById("rubikSearchInput");
            const catFilter = document.getElementById("rubikCategoryFilter");
            if (searchInput) searchInput.addEventListener("input", applyRubikFilters);
            if (catFilter) catFilter.addEventListener("change", applyRubikFilters);

            loadRubikDirectory();
        });
    </script>

    <!-- Script Navbar & Counter -->
    <script src="assets/js/navbar.js?v=2.0"></script>
    <script type="module" src="assets/js/counter.js"></script>
</body>

</html>
